<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <rect width="600" height="380" rx="16" fill="#FAF4F6"/>
  <!-- Design System board -->
  <rect x="40" y="40" width="520" height="300" rx="14" fill="#FFFFFF" stroke="#F8C8DC" stroke-width="2"/>
  <text x="70" y="75" font-family="'Playfair Display', serif" font-size="20" font-weight="700" fill="#A65D78">Aesthetic Design System</text>
  <line x1="70" y1="88" x2="530" y2="88" stroke="#F8C8DC" stroke-width="1.5"/>
  <!-- Color Swatches -->
  <circle cx="95" cy="130" r="22" fill="#F8C8DC" stroke="#FFFFFF" stroke-width="3"/>
  <text x="95" y="170" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#662D42" text-anchor="middle">#F8C8DC</text>
  <circle cx="165" cy="130" r="22" fill="#FFFFFF" stroke="#A65D78" stroke-width="2"/>
  <text x="165" y="170" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#662D42" text-anchor="middle">#FFFFFF</text>
  <circle cx="235" cy="130" r="22" fill="#A65D78" stroke="#FFFFFF" stroke-width="3"/>
  <text x="235" y="170" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#662D42" text-anchor="middle">#A65D78</text>
  <!-- Typography Samples -->
  <rect x="310" y="110" width="220" height="80" rx="10" fill="#FAF4F6"/>
  <text x="325" y="138" font-family="'Playfair Display', serif" font-size="16" font-weight="700" fill="#A65D78">Playfair Display</text>
  <text x="325" y="162" font-family="'Poppins', sans-serif" font-size="12" fill="#662D42">Poppins Regular &amp; Medium</text>
  <!-- Components preview -->
  <rect x="70" y="210" width="130" height="36" rx="18" fill="#A65D78"/>
  <text x="135" y="233" font-family="'Poppins', sans-serif" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle">Primary CTA</text>
  <rect x="220" y="210" width="130" height="36" rx="18" fill="#FFFFFF" stroke="#A65D78" stroke-width="1.5"/>
  <text x="285" y="233" font-family="'Poppins', sans-serif" font-size="12" font-weight="500" fill="#A65D78" text-anchor="middle">Outline Button</text>
  <rect x="370" y="206" width="160" height="44" rx="10" fill="#FAF4F6" stroke="#F8C8DC"/>
  <text x="385" y="233" font-family="'Poppins', sans-serif" font-size="12" fill="#A65D78">Input Form Field</text>
  <rect x="70" y="270" width="460" height="40" rx="8" fill="linear-gradient(90deg, #F8C8DC 0%, #A65D78 100%)" fill-opacity="0.15"/>
</svg>
